name: Gust
options:
  bundleIdPrefix: dev.priyanshu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  BreezyUnits:
    path: ../BreezyUnits

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift 6 language mode rejects patterns this codebase uses deliberately
    # (mutable state handed between actors). Keep 5 until that is addressed.
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Gust:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BreezyUnits
        product: BreezyUnits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.priyanshu.gust
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Gust
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: >-
          Shows the weather where you are. Location is used only to choose the
          forecast location and is never sent anywhere except the weather
          service you select.
    attributes:
      SystemCapabilities:
        com.apple.MobileExecutionPlatform: false

  GustUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Gust
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.priyanshu.gust.uitests
        TEST_TARGET_NAME: Gust

schemes:
  Gust:
    build:
      targets:
        Gust: all
        GustUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        - "-resetState"
    test:
      config: Debug
      targets:
        - GustUITests
